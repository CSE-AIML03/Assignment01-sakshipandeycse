<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Border Example</title>
  <style>
    .bordered-image {
      width: 300px;
      margin: 50px auto;
      padding: 20px;
      border: double 8px rgb(90, 10, 10); 
      text-align: center;
      background-color: #fff;
    }

    .bordered-image img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="bordered-image">
    <img src="https://images.unsplash.com/photo-1611267254323-4db7b39c732c?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Y3V0ZSUyMGNhdHxlbnwwfHwwfHx8MA%3D%3D">
    <h2>Badmosh Billu</h2>
    <p>😋😍</p>
  </div>
</body>
</html>
